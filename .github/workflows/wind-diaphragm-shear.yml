# Manual runs on a standard 4-vCPU ubuntu-24.04 runner.
# Kit pin: google-research/ple 8320f0402fdca9f42476607f72bcfd5271cd50c9
# Harbor pin required by that revision: 0.20.0 (with websockets).
# Entry: official pi-opus sample. Agent logic is unchanged.
#
# mode=smoke: kit check's synthetic hello.txt task. A temporary copy sets
# model_api to gemini/gemini-3.5-flash-lite. No dataset. Secret: GEMINI_API_KEY.
#
# mode=score: wind-diaphragm-shear through gemini/gemini-3.5-flash-lite.
# A temporary copy changes only model_api. The Pi agent and the dataset
# verifier stay as published. Secrets: GEMINI_API_KEY and HF_TOKEN. Uses
# --trials 1 and --no-export. Does not start unless send_gated_task is yes.
# After scoring, a sanitized deliverable diagnostic is printed (no file
# contents, no instruction text, no secrets).
name: PLE Pi experiment

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: smoke calls Gemini on a synthetic task. score grades wind-diaphragm-shear.
        required: true
        type: choice
        options:
          - smoke
          - score
        default: smoke
      send_gated_task:
        description: score only. Leave no until unpaid-Gemini use of dev-task inputs is allowed.
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: ple-pi-${{ inputs.mode }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: inputs.mode == 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Check out PLE kit
        uses: actions/checkout@v4
        with:
          repository: google-research/ple
          ref: 8320f0402fdca9f42476607f72bcfd5271cd50c9
          path: ple
          persist-credentials: false

      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check CPU, RAM, disk, and Docker
        working-directory: ple
        run: |
          set -euo pipefail
          if find "$GITHUB_WORKSPACE/harness" \( -name '*.env' -o -name 'gcp-sa.json' \) | grep -q .; then
            echo "The harness checkout contains an env or credential file. Remove it before this run."
            exit 1
          fi
          docker info >/dev/null
          uv sync --quiet
          host_cpus=$(nproc)
          host_mem=$(awk '/MemTotal:/ {print $2 * 1024}' /proc/meminfo)
          docker_cpus=$(docker info --format '{{.NCPU}}')
          docker_mem=$(docker info --format '{{.MemTotal}}')
          disk=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
          # kit check uses a 2-CPU, 4 GiB task container, a 2-CPU, 4 GiB serve
          # container, and a 256 MiB egress proxy.
          limit_cpus=2
          need_mem=$((2 * 4 * 1073741824 + 256 * 1048576))
          need_disk=$((10 * 1073741824))
          {
            echo "### Smoke capacity"
            echo "- Largest CPU limit: ${limit_cpus}"
            echo "- Memory reserved together: $((need_mem / 1048576)) MiB"
            echo "- Host CPUs: ${host_cpus}. Docker CPUs: ${docker_cpus}."
            echo "- Host RAM: $((host_mem / 1048576)) MiB. Docker RAM: $((docker_mem / 1048576)) MiB."
            echo "- Free disk: $((disk / 1073741824)) GiB."
          } >> "$GITHUB_STEP_SUMMARY"
          short=0
          if [ "$host_cpus" -lt "$limit_cpus" ] || [ "$docker_cpus" -lt "$limit_cpus" ]; then
            echo "Need a Docker daemon with at least ${limit_cpus} CPUs. Host has ${host_cpus} and Docker has ${docker_cpus}."
            short=1
          fi
          if [ "$host_mem" -lt "$need_mem" ] || [ "$docker_mem" -lt "$need_mem" ]; then
            echo "Need ${need_mem} bytes of RAM. Host has ${host_mem} and Docker has ${docker_mem}."
            short=1
          fi
          if [ "$disk" -lt "$need_disk" ]; then
            echo "Need 10 GiB free disk. This filesystem has ${disk} bytes free."
            short=1
          fi
          if [ "$short" -ne 0 ]; then
            exit 1
          fi
          echo "Capacity check passed."

      - name: Probe Gemini directly
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GitHub secret GEMINI_API_KEY is empty."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
          model = "gemini-3.5-flash-lite"
          key = os.environ["GEMINI_API_KEY"]
          timeout = 45
          waits = (10, 20, 40)
          out = os.environ["RUNNER_TEMP"] + "/direct-probe.txt"

          def once(limit_field):
              started = time.monotonic()
              payload = {
                  "model": model,
                  "messages": [{"role": "user", "content": "Reply with the word OK."}],
                  limit_field: 32,
              }
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": "Bearer " + key,
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      response.read()
                      return response.status, time.monotonic() - started, ""
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors="replace")
                  return exc.code, time.monotonic() - started, body
              except TimeoutError:
                  return "timeout", time.monotonic() - started, ""
              except urllib.error.URLError as exc:
                  reason = getattr(exc, "reason", exc)
                  if isinstance(reason, TimeoutError) or "timed out" in str(reason).lower():
                      return "timeout", time.monotonic() - started, ""
                  return "error", time.monotonic() - started, ""

          lines = []
          try:
              for attempt in range(1, 5):
                  status, elapsed, body = once("max_completion_tokens")
                  if status == 400 and "max_completion_tokens" in body:
                      status, elapsed, body = once("max_tokens")
                  line = f"direct status={status} elapsed={elapsed:.1f}"
                  print(line, flush=True)
                  lines.append(line)
                  if status == 200 or status not in (503, "timeout") or attempt == 4:
                      break
                  time.sleep(waits[attempt - 1])
          except Exception:
              lines.append("direct status=error elapsed=0.0")
              print(lines[-1], flush=True)
          with open(out, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("### Direct Gemini probe\n\n" + "\n".join(f"- {line}" for line in lines) + "\n")
          PY
          unset GEMINI_API_KEY

      - name: Run the synthetic Gemini smoke check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: ple
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GitHub secret GEMINI_API_KEY is empty."
            exit 1
          fi
          src="$RUNNER_TEMP/smoke-harness"
          rm -rf "$src"
          mkdir -p "$src"
          tar -C "$GITHUB_WORKSPACE/harness" \
            --exclude .git \
            --exclude .github \
            --exclude '*.env' \
            --exclude '.env' \
            -cf - . | tar -C "$src" -xf -
          python3 - "$src/submission.yaml" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "model_api: google-cloud/claude-opus-5-5\n"
          new = "model_api: gemini/gemini-3.5-flash-lite\n"
          if old not in text:
              sys.exit("the baseline model_api line was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cmp "$GITHUB_WORKSPACE/harness/serve.py" "$src/serve.py"
          if cmp -s "$GITHUB_WORKSPACE/harness/submission.yaml" "$src/submission.yaml"; then
            echo "The smoke copy did not change model_api."
            exit 1
          fi
          umask 077
          envfile="$RUNNER_TEMP/gemini.env"
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > "$envfile"
          unset GEMINI_API_KEY
          uv run python -m kit check "$src" --env-file "$envfile" --work "$RUNNER_TEMP/smoke-work"

      - name: Report the smoke stages
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "smoke-work" / "check.json"
          lines = ["### Synthetic smoke", ""]
          probe = Path(os.environ["RUNNER_TEMP"]) / "direct-probe.txt"
          if probe.is_file():
              lines.append("- Direct probe:")
              lines.extend(f"  - {line}" for line in probe.read_text(encoding="utf-8").splitlines())
          if not path.is_file():
              lines.append("No check.json was written.")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              lines.append("- Harness: pi-opus (official sample)")
              lines.append("- Model: gemini/gemini-3.5-flash-lite through Google AI Studio")
              lines.append("- Task: kit check synthetic smoke (no PLE dataset)")
              for stage in data.get("stages") or []:
                  lines.append(f"- {stage.get('name')}: {stage.get('status')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

      - name: Remove the smoke copy and credentials
        if: always()
        run: |
          set -euo pipefail
          rm -rf \
            "$RUNNER_TEMP/smoke-harness" \
            "$RUNNER_TEMP/gemini.env" \
            "$RUNNER_TEMP/direct-probe.txt" \
            "$RUNNER_TEMP/smoke-work" \
            "$HOME/.cache/plebench" \
            "$HOME/.cache/huggingface"

  score:
    if: inputs.mode == 'score'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Stop before gated task data is sent
        if: inputs.send_gated_task != 'yes'
        run: |
          echo "Stopped before downloading or sending wind-diaphragm-shear."
          echo "Unpaid Gemini uses submitted content to improve Google products. The dataset terms allow external API evaluation and forbid distillation. Leave send_gated_task at no until that point is resolved."
          exit 1

      - name: Check out harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false

      - name: Check out PLE kit
        uses: actions/checkout@v4
        with:
          repository: google-research/ple
          ref: 8320f0402fdca9f42476607f72bcfd5271cd50c9
          path: ple
          persist-credentials: false

      - name: Install uv and Harbor 0.20.0
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install "harbor==0.20.0" --with websockets
          probe=$(sed -n '1s/^#!//p' "$HOME/.local/bin/harbor")
          version=$("$probe" -c "import importlib.metadata as m, websockets; print(m.version('harbor'))")
          test "$version" = "0.20.0"
          echo "harbor ${version}"

      - name: Check CPU, RAM, disk, Docker, and dataset access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        working-directory: ple
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "GitHub secret HF_TOKEN is empty."
            exit 1
          fi
          if find "$GITHUB_WORKSPACE/harness" \( -name '*.env' -o -name 'gcp-sa.json' \) | grep -q .; then
            echo "The harness checkout contains an env or credential file. Remove it before this run."
            exit 1
          fi
          docker info >/dev/null
          uv sync --quiet
          host_cpus=$(nproc)
          host_mem=$(awk '/MemTotal:/ {print $2 * 1024}' /proc/meminfo)
          docker_cpus=$(docker info --format '{{.NCPU}}')
          docker_mem=$(docker info --format '{{.MemTotal}}')
          disk=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')
          specs=$(uv run --quiet --no-sync python - <<'PY'
          import os, sys, tomllib
          from pathlib import Path
          token = os.environ["HF_TOKEN"]
          dest = Path(os.environ["RUNNER_TEMP"]) / "wind-task-toml"
          dest.mkdir(parents=True, exist_ok=True)
          try:
              from huggingface_hub import hf_hub_download
              path = hf_hub_download(
                  repo_id="google/physical-engineerings-last-exam",
                  repo_type="dataset",
                  filename="tasks/wind-diaphragm-shear/task.toml",
                  token=token,
                  local_dir=str(dest),
              )
          except Exception as exc:
              name = type(exc).__name__
              if name == "GatedRepoError" or "403" in str(exc):
                  print("Hugging Face returned 403. The HF_TOKEN account cannot download the gated dataset.", file=sys.stderr)
                  sys.exit(2)
              print(f"dataset download failed ({name})", file=sys.stderr)
              sys.exit(1)
          env = tomllib.loads(Path(path).read_text(encoding="utf-8")).get("environment") or {}
          cpus = env.get("cpus")
          mem = env.get("memory_mb")
          if not isinstance(cpus, int) or isinstance(cpus, bool) or cpus < 1:
              cpus = 2
          if not isinstance(mem, int) or isinstance(mem, bool) or mem < 1:
              mem = 4096
          print(f"{cpus} {mem}")
          PY
          )
          task_cpus=${specs%% *}
          task_mib=${specs##* }
          # Each container is limited on its own. The serve container asks for
          # 2 CPUs; the egress proxy asks for none. Their sum is not a Docker limit.
          serve_cpus=2
          if [ "$task_cpus" -gt "$serve_cpus" ]; then
            limit_cpus=$task_cpus
          else
            limit_cpus=$serve_cpus
          fi
          need_mem=$((task_mib * 1048576 + 4 * 1073741824 + 256 * 1048576))
          need_disk=$((10 * 1073741824))
          {
            echo "### Capacity"
            echo "- Task container: ${task_cpus} CPUs, ${task_mib} MiB"
            echo "- Serve container: 2 CPUs, 4 GiB"
            echo "- Egress proxy: 256 MiB"
            echo "- Largest CPU limit: ${limit_cpus}. CPU limits are not added together."
            echo "- Memory reserved together: $((need_mem / 1073741824)) GiB plus $(( (need_mem % 1073741824) / 1048576 )) MiB"
            echo "- Host CPUs: ${host_cpus}. Docker CPUs: ${docker_cpus}."
            echo "- Host RAM: $((host_mem / 1048576)) MiB. Docker RAM: $((docker_mem / 1048576)) MiB."
            echo "- Free disk: $((disk / 1073741824)) GiB."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$RUNNER_TEMP/wind-task-toml"
          short=0
          if [ "$host_cpus" -lt "$limit_cpus" ] || [ "$docker_cpus" -lt "$limit_cpus" ]; then
            echo "Need a Docker daemon with at least ${limit_cpus} CPUs for the largest container. Host has ${host_cpus} and Docker has ${docker_cpus}."
            short=1
          fi
          if [ "$host_mem" -lt "$need_mem" ] || [ "$docker_mem" -lt "$need_mem" ]; then
            echo "Need ${need_mem} bytes of RAM. Host has ${host_mem} and Docker has ${docker_mem}."
            short=1
          fi
          if [ "$disk" -lt "$need_disk" ]; then
            echo "Need 10 GiB free disk. This filesystem has ${disk} bytes free."
            short=1
          fi
          if [ "$short" -ne 0 ]; then
            exit 1
          fi
          echo "Capacity check passed."

      - name: Probe Gemini thinking HIGH (Pi effective level)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GitHub secret GEMINI_API_KEY is empty."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.request

          # Pi 1.1.0 clamps harness THINKING=max to high for gemini-3.5-flash-lite
          # because catalog thinkingLevelMap sets max:null and xhigh:null.
          model = "gemini-3.5-flash-lite"
          key = os.environ["GEMINI_API_KEY"]
          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              f"{model}:generateContent"
          )
          timeout = 45
          out = os.environ["RUNNER_TEMP"] + "/thinking-probe.txt"
          codes = (
              "INVALID_ARGUMENT",
              "FAILED_PRECONDITION",
              "RESOURCE_EXHAUSTED",
              "UNAVAILABLE",
              "PERMISSION_DENIED",
              "NOT_FOUND",
              "INTERNAL",
          )

          def classify(status, body):
              provider = "none"
              for code in codes:
                  if code in body:
                      provider = code
                      break
              err_class = "ok" if status == 200 else "http_error"
              if status == "timeout":
                  err_class = "timeout"
              elif status == "error":
                  err_class = "transport_error"
              # Never log body text; only structured fields.
              return err_class, provider

          def once(thinking_level):
              started = time.monotonic()
              payload = {
                  "contents": [{"role": "user", "parts": [{"text": "Reply with OK."}]}],
                  "generationConfig": {
                      "maxOutputTokens": 32,
                      "thinkingConfig": {
                          "includeThoughts": True,
                          "thinkingLevel": thinking_level,
                      },
                  },
              }
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": key,
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      response.read()
                      return response.status, time.monotonic() - started, ""
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors="replace")
                  return exc.code, time.monotonic() - started, body
              except TimeoutError:
                  return "timeout", time.monotonic() - started, ""
              except urllib.error.URLError as exc:
                  reason = getattr(exc, "reason", exc)
                  if isinstance(reason, TimeoutError) or "timed out" in str(reason).lower():
                      return "timeout", time.monotonic() - started, ""
                  return "error", time.monotonic() - started, ""

          lines = [
              "harness_thinking=max",
              "pi_effective_thinking=high",
              "probe_thinking_level=HIGH",
          ]
          # Probe the effective Pi mapping first, then an unsupported MAX once.
          for level in ("HIGH", "MAX"):
              status, elapsed, body = once(level)
              err_class, provider = classify(status, body)
              line = (
                  f"thinking_probe level={level} status={status} "
                  f"error_class={err_class} provider_code={provider} elapsed={elapsed:.1f}"
              )
              print(line, flush=True)
              lines.append(line)
              if level == "HIGH" and status in (503, "timeout"):
                  time.sleep(10)
                  status, elapsed, body = once(level)
                  err_class, provider = classify(status, body)
                  line = (
                      f"thinking_probe level={level} retry status={status} "
                      f"error_class={err_class} provider_code={provider} elapsed={elapsed:.1f}"
                  )
                  print(line, flush=True)
                  lines.append(line)
          with open(out, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(
                  "### Gemini thinking probe\n\n"
                  + "\n".join(f"- {line}" for line in lines)
                  + "\n"
              )
          PY
          unset GEMINI_API_KEY

      - name: Score wind-diaphragm-shear
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: ple
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ] || [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GitHub secrets HF_TOKEN and GEMINI_API_KEY must both be set."
            exit 1
          fi
          src="$RUNNER_TEMP/score-harness"
          rm -rf "$src"
          mkdir -p "$src"
          tar -C "$GITHUB_WORKSPACE/harness" \
            --exclude .git \
            --exclude .github \
            --exclude '*.env' \
            --exclude '.env' \
            -cf - . | tar -C "$src" -xf -
          python3 - "$src/submission.yaml" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "model_api: google-cloud/claude-opus-5-5\n"
          new = "model_api: gemini/gemini-3.5-flash-lite\n"
          if old not in text:
              sys.exit("the baseline model_api line was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cmp "$GITHUB_WORKSPACE/harness/serve.py" "$src/serve.py"
          umask 077
          envfile="$RUNNER_TEMP/ple.env"
          {
            printf 'HF_TOKEN=%s\n' "$HF_TOKEN"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
          } > "$envfile"
          unset HF_TOKEN GEMINI_API_KEY
          uv run python eval/run.py "$src" \
            --env-file "$envfile" \
            --tasks wind-diaphragm-shear \
            --trials 1 \
            --no-export \
            --out "$RUNNER_TEMP/ple-run"

      - name: Report score, runtime, and token usage
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "ple-run" / "results.json"
          lines = ["### Score", ""]
          if not path.is_file():
              lines.append("No results.json was written, so this job has no score, runtime, or token usage.")
          else:
              data = json.loads(path.read_text(encoding="utf-8"))
              rows = data.get("tasks") or []
              row = next((item for item in rows if item.get("id") == "wind-diaphragm-shear"), {})
              tokens = row.get("tokens") or {}
              seconds = row.get("seconds")
              runtime = "not recorded" if not isinstance(seconds, (int, float)) else f"{seconds:.1f} seconds"
              lines.extend([
                  f"- Score: {row.get('score', data.get('score'))}",
                  f"- Runtime: {runtime}",
                  f"- Token usage: input {int(tokens.get('input') or 0)}, cache {int(tokens.get('cache') or 0)}, output {int(tokens.get('output') or 0)}",
                  f"- Status: {row.get('status', 'unknown')}",
                  f"- results.json: `{path}` (not uploaded; the run directory, transcripts, and this file are deleted before the job exits)",
              ])
          summary = "\n".join(lines) + "\n"
          print(summary, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary)
          PY

      - name: Sanitized deliverable diagnostic
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "ple-run"
          expected_rel = (
              "filesystem/final_batch4__structural_task5_wind_diaphragm_shear__blind"
              "/output/submission.zip"
          )
          expected_name = "submission.zip"
          write_tools = ("write", "edit", "bash")
          write_attempted = "unknown"
          write_result = "unknown"
          expected_present = "unknown"
          file_collected = "unknown"
          exit_reason = "unknown"
          provider_error = "no"
          agent_status = "unknown"
          tool_counts = {name: 0 for name in write_tools}
          write_args_mention_zip = "no"
          final_message_bytes = 0
          changed_files = 0
          collected_zip_bytes = None
          http_status = "unknown"
          provider_code = "unknown"
          error_class = "unknown"
          # Pi 1.1.0 clamps harness THINKING=max to high for this model.
          thinking_effective = "high"
          harness_thinking = "max"

          def scrub(text: str) -> str:
              text = re.sub(r"AIza[0-9A-Za-z_\-]{20,}", "[redacted]", text)
              text = re.sub(r"hf_[A-Za-z0-9]{10,}", "[redacted]", text)
              return text

          def classify_provider(blob: str):
              status = "unknown"
              code = "none"
              klass = "none"
              statuses = re.findall(
                  r"\b(?:HTTP\/?\s*)?(?:status[=: ]+)?(400|401|403|404|408|429|500|502|503|504)\b",
                  blob,
                  flags=re.I,
              )
              if statuses:
                  status = statuses[-1]
              for name in (
                  "INVALID_ARGUMENT",
                  "FAILED_PRECONDITION",
                  "RESOURCE_EXHAUSTED",
                  "UNAVAILABLE",
                  "PERMISSION_DENIED",
                  "NOT_FOUND",
                  "INTERNAL",
              ):
                  if re.search(rf"\b{name}\b", blob):
                      code = name
                      break
              if re.search(r"Unsupported Google thinking level", blob, re.I):
                  klass = "unsupported_thinking_mapping"
              elif re.search(r"timeout|timed out", blob, re.I):
                  klass = "timeout"
              elif status == "503" or code == "UNAVAILABLE":
                  klass = "unavailable"
              elif status == "429" or code == "RESOURCE_EXHAUSTED":
                  klass = "rate_limited"
              elif status == "400" or code == "INVALID_ARGUMENT":
                  klass = "invalid_argument"
              elif re.search(r"pi:\s*model error|stopReason\":\s*\"error\"", blob, re.I):
                  klass = "model_error"
              return status, code, klass

          def load_json(path: Path):
              try:
                  return json.loads(path.read_text(encoding="utf-8", errors="replace"))
              except Exception:
                  return None

          results = root / "results.json"
          if results.is_file():
              data = load_json(results) or {}
              row = next(
                  (
                      item
                      for item in (data.get("tasks") or [])
                      if item.get("id") == "wind-diaphragm-shear"
                  ),
                  {},
              )
              agent_status = str(row.get("status") or "unknown")

          trials = sorted(root.glob("attempt*/jobs/dev/wind-diaphragm-shear__*/"))
          trial = trials[-1] if trials else None
          if trial is None:
              exit_reason = "no_trial_directory"
          else:
              result = load_json(trial / "result.json") or {}
              agent = result.get("agent_result") or {}
              verifier = result.get("verifier_result") or {}
              exc = result.get("exception_info") or result.get("exception") or {}
              if isinstance(exc, dict) and exc:
                  exit_reason = scrub(str(exc.get("type") or exc.get("message") or "exception"))[:120]
              elif agent.get("failure_reason") or agent.get("error_message"):
                  exit_reason = scrub(
                      str(agent.get("failure_reason") or agent.get("error_message"))
                  )[:120]
              else:
                  reward = ((verifier.get("rewards") or {}).get("reward"))
                  exit_reason = f"harbor_ok reward={reward}"

              agent_dir = trial / "agent"
              deliverables = agent_dir / "deliverables"
              capture = load_json(deliverables / "capture.json") or {}
              changed = capture.get("changed") or capture.get("files") or {}
              if isinstance(changed, dict):
                  changed_files = len(changed)
              elif isinstance(changed, list):
                  changed_files = len(changed)

              fm = deliverables / "final_message.md"
              if not fm.is_file():
                  fm = deliverables / "final_message.txt"
              if fm.is_file():
                  final_message_bytes = fm.stat().st_size

              zip_path = deliverables / "files" / expected_rel
              if zip_path.is_file():
                  expected_present = "yes"
                  file_collected = "yes"
                  collected_zip_bytes = zip_path.stat().st_size
              else:
                  expected_present = "no"
                  any_zip = list((deliverables / "files").rglob(expected_name)) if (deliverables / "files").is_dir() else []
                  file_collected = "yes_other_path" if any_zip else "no"
                  if any_zip:
                      collected_zip_bytes = any_zip[0].stat().st_size

              # Scan agent logs for tool starts and provider errors. Never print bodies.
              log_blobs = []
              for path in agent_dir.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix.lower() not in {".log", ".txt", ".json", ".jsonl"} and path.name not in {
                      "serve.log",
                      "egress.log",
                      "trajectory.json",
                      "command-0",
                  }:
                      continue
                  if path.stat().st_size > 8_000_000:
                      continue
                  try:
                      log_blobs.append(path.read_text(encoding="utf-8", errors="replace"))
                  except Exception:
                      continue
              blob = "\n".join(log_blobs)
              if re.search(r"pi:\s*model error", blob, re.I) or re.search(
                  r"stopReason\":\s*\"error\"", blob
              ):
                  provider_error = "yes"
              http_status, provider_code, error_class = classify_provider(blob)
              # Prefer explicit thinking mentions if present; otherwise keep clamp result.
              if re.search(r"thinkingLevel[\"'=: ]+HIGH", blob, re.I) or re.search(
                  r"\bthinking(?: level)?[=: ]+high\b", blob, re.I
              ):
                  thinking_effective = "high"
              elif re.search(r"Unsupported Google thinking level.*\bmax\b", blob, re.I):
                  thinking_effective = "max_unmapped"
              # Pi harness logs: pi: write {...}
              for tool in write_tools:
                  tool_counts[tool] = len(
                      re.findall(rf"pi:\s*{tool}\b", blob, flags=re.I)
                  )
              if any(tool_counts[t] for t in write_tools):
                  write_attempted = "yes"
              elif blob:
                  write_attempted = "no"
              if re.search(r"submission\.zip", blob, re.I):
                  write_args_mention_zip = "yes"
              # Heuristic write result from nearby error lines after a write tool.
              if write_attempted == "yes":
                  if re.search(
                      r"pi:\s*(write|edit|bash).{0,200}(error|failed|EACCES|ENOENT|reject)",
                      blob,
                      re.I | re.S,
                  ):
                      write_result = "error_seen"
                  elif expected_present == "yes":
                      write_result = "success_inferred"
                  else:
                      write_result = "attempted_but_expected_missing"
              elif write_attempted == "no":
                  write_result = "no_write_tool_logged"

          probe = Path(os.environ["RUNNER_TEMP"]) / "thinking-probe.txt"
          probe_lines = []
          if probe.is_file():
              probe_lines = [
                  line for line in probe.read_text(encoding="utf-8").splitlines() if line.strip()
              ]

          lines = [
              "### Sanitized deliverable diagnostic",
              "",
              f"- harness_thinking: {harness_thinking}",
              f"- thinking_effective: {thinking_effective}",
              f"- write_attempted: {write_attempted}",
              f"- write_tool_counts: write={tool_counts['write']} edit={tool_counts['edit']} bash={tool_counts['bash']}",
              f"- write_args_mention_submission_zip: {write_args_mention_zip}",
              f"- write_result: {write_result}",
              f"- expected_output_present_before_done: {expected_present}",
              f"- file_collected: {file_collected}",
              f"- collected_zip_bytes: {collected_zip_bytes}",
              f"- changed_deliverable_files: {changed_files}",
              f"- final_message_bytes: {final_message_bytes}",
              f"- provider_error: {provider_error}",
              f"- error_class: {error_class}",
              f"- http_status: {http_status}",
              f"- provider_code: {provider_code}",
              f"- agent_status: {agent_status}",
              f"- exit_reason: {exit_reason}",
          ]
          if probe_lines:
              lines.append("- thinking_probe:")
              lines.extend(f"  - {line}" for line in probe_lines)
          text = "\n".join(lines) + "\n"
          print(text, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(text)
          PY

      - name: Remove credentials and the local transcript
        if: always()
        run: |
          set -euo pipefail
          rm -rf \
            "$RUNNER_TEMP/ple.env" \
            "$RUNNER_TEMP/score-harness" \
            "$RUNNER_TEMP/ple-run" \
            "$RUNNER_TEMP/thinking-probe.txt" \
            "$RUNNER_TEMP/wind-task-toml" \
            "$HOME/.cache/plebench" \
            "$HOME/.cache/huggingface"
